# 실행: 레포 루트에서  docker compose -f infra/docker-compose.yml up --build
# 이 파일 안의 상대 경로(../.env, ../backend 등)는 이 파일이 있는 infra/ 기준이다.
name: farmit

services:
  mysql:
    image: mysql:8.4
    env_file: ../.env              # MYSQL_DATABASE·USER·PASSWORD·ROOT_PASSWORD로 첫 실행 때 DB와 계정을 만든다
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00 # DB에는 UTC로 저장한다. 한국 시간 변환은 Django가 한다
    ports:
      - "3307:3306"                # 호스트 3307 → 컨테이너 3306 (DB 도구 접속용)
    volumes:
      - mysql-data:/var/lib/mysql                         # 데이터 보존. down -v 하면 지워진다
      - ./mysql/init:/docker-entrypoint-initdb.d:ro       # 볼륨이 비어 있을 때(첫 실행)만 실행된다
    healthcheck:
      # -h 127.0.0.1 로 TCP 접속을 확인한다. 첫 실행 때 초기화용 임시 서버는 소켓으로만 떠서
      # TCP ping이 실패하므로, 초기화가 끝나고 진짜 서버가 뜬 뒤에야 healthy가 된다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ../backend
    env_file: ../.env
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app            # 코드 변경이 바로 반영된다 (runserver 자동 재시작)
    depends_on:
      mysql:
        condition: service_healthy # mysql healthcheck가 통과한 뒤 시작

  # ── 실시간 경로: 수집기 → Kafka → Flink → MySQL ──────────────────────────
  kafka:
    image: apache/kafka:3.9.1      # KRaft 모드(ZooKeeper 없음), 브로커+컨트롤러 1대
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw            # 로컬용 고정 클러스터 ID (이미지 기본값과 같음)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 3개: 컨테이너끼리(kafka:9092), 호스트에서(localhost:29092), 컨트롤러 내부용(9093)
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 브로커가 1대라 내부 토픽 복제 수를 1로 낮춘다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:29092:29092"    # 내 PC에서만 접속 (외부에 열지 않는다)
    # 볼륨 없음: Kafka는 전달 통로이고 데이터는 MySQL에 남는다. down 하면 토픽이 지워진다
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # 토픽 생성용 일회성 컨테이너. 토픽을 만들고 종료한다 (ps -a 에서 Exited (0)이면 정상)
  # 볼륨이 없어 up 할 때마다 실행되므로 --if-not-exists 로 이미 있으면 건너뛴다
  kafka-init:
    image: apache/kafka:3.9.1
    command:
      - sh
      - -c
      - |
        # weather.warning.event: Flink가 새로 생기거나 바뀐 특보만 골라 보내는 토픽 (알림이 읽는다)
        for t in auction.trade.raw weather.warning.raw weather.warning.event; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 1 --replication-factor 1 --config retention.ms=604800000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  flink-jobmanager:
    build: ../streaming/flink      # Flink + Kafka·JDBC 커넥터, MySQL 드라이버
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    ports:
      - "127.0.0.1:8081:8081"      # Flink 웹 UI, 내 PC에서만 접속
    volumes:
      - ../streaming:/opt/farmit/streaming:ro   # Flink SQL 파일을 컨테이너 안에서 바로 실행
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # 토픽이 만들어진 뒤 시작
      mysql:
        condition: service_healthy

  flink-taskmanager:
    build: ../streaming/flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        # Flink 작업 1개가 슬롯 1개를 쓴다. 지금 2개(weather_warning, auction_trade) + 2주차 realtime_price 등 여유
        taskmanager.numberOfTaskSlots: 4
    depends_on:
      - flink-jobmanager

  # 실시간 경매 프로듀서: 한국 시간 00~12시에 5분마다 API → Kafka(auction.trade.raw)
  # 각자 인증키로 API를 부르므로 기본으로는 뜨지 않는다. 켤 때: --profile auction up -d
  auction-producer:
    build: ../collectors/auction
    profiles: ["auction"]
    env_file: ../.env              # DATA_GO_KR_KEY, MYSQL_*, DB_HOST·DB_PORT
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092   # .env의 localhost:29092(호스트용)보다 우선한다
    volumes:
      - ../collectors/auction:/app # 코드 변경 후 restart만 하면 반영된다
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # 토픽이 만들어진 뒤 시작
      mysql:
        condition: service_healthy

  # 기상특보 수집기: 10분마다 최근 6일치를 weather.warning.raw로 보낸다 (REQ-COL-004, REQ-ALT-001)
  weather-warning-producer:
    build: ../collectors/weather_warning
    command: python producer.py --every 600
    env_file: ../.env                # DATA_GO_KR_KEY
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092   # .env의 localhost:29092(호스트용)보다 우선한다
    volumes:
      - ../collectors/weather_warning:/app  # 코드 변경 후 restart만 하면 반영된다 (auction-producer와 같게)
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # 기상특보 알림: weather.warning.event를 읽어 special_event·alert를 만든다 (REQ-ALT-001)
  # backend 이미지·코드를 그대로 쓴다. 테이블은 backend가 시작할 때 migrate로 만든다
  alert-consumer:
    build: ../backend
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python manage.py consume_warning_events
    volumes:
      - ../backend:/app
    # migrate 전에 떠서 테이블이 없으면 멈췄다가 다시 뜬다 (DB 오류 때도 같은 방식으로 재시도)
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      backend:
        condition: service_started

volumes:
  mysql-data:
