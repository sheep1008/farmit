# 실행: 레포 루트에서  docker compose -f infra/docker-compose.yml up --build
# 이 파일 안의 상대 경로(../.env, ../backend 등)는 이 파일이 있는 infra/ 기준이다.
name: farmit

services:
  mysql:
    image: mysql:8.4
    env_file: ../.env              # MYSQL_DATABASE·USER·PASSWORD·ROOT_PASSWORD로 첫 실행 때 DB와 계정을 만든다
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00 # DB에는 UTC로 저장한다. 한국 시간 변환은 Django가 한다
    ports:
      - "3307:3306"                # 호스트 3307 → 컨테이너 3306 (DB 도구 접속용)
    volumes:
      - mysql-data:/var/lib/mysql                         # 데이터 보존. down -v 하면 지워진다
      - ./mysql/init:/docker-entrypoint-initdb.d:ro       # 볼륨이 비어 있을 때(첫 실행)만 실행된다
    healthcheck:
      # -h 127.0.0.1 로 TCP 접속을 확인한다. 첫 실행 때 초기화용 임시 서버는 소켓으로만 떠서
      # TCP ping이 실패하므로, 초기화가 끝나고 진짜 서버가 뜬 뒤에야 healthy가 된다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ../backend
    env_file: ../.env
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app            # 코드 변경이 바로 반영된다 (runserver 자동 재시작)
    depends_on:
      mysql:
        condition: service_healthy # mysql healthcheck가 통과한 뒤 시작

  # ── 실시간 경로: 수집기 → Kafka → Flink → MySQL ──────────────────────────
  kafka:
    image: apache/kafka:3.9.1      # KRaft 모드(ZooKeeper 없음), 브로커+컨트롤러 1대
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw            # 로컬용 고정 클러스터 ID (이미지 기본값과 같음)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 리스너 3개: 컨테이너끼리(kafka:9092), 호스트에서(localhost:29092), 컨트롤러 내부용(9093)
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 브로커가 1대라 내부 토픽 복제 수를 1로 낮춘다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:29092:29092"    # 내 PC에서만 접속 (외부에 열지 않는다)
    # 볼륨 없음: Kafka는 전달 통로이고 데이터는 MySQL에 남는다. down 하면 토픽이 지워진다
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  flink-jobmanager:
    build: ../streaming/flink      # Flink + Kafka·JDBC 커넥터, MySQL 드라이버
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    ports:
      - "127.0.0.1:8081:8081"      # Flink 웹 UI, 내 PC에서만 접속
    volumes:
      - ../streaming:/opt/farmit/streaming:ro   # Flink SQL 파일을 컨테이너 안에서 바로 실행
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy

  flink-taskmanager:
    build: ../streaming/flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - flink-jobmanager

volumes:
  mysql-data:
