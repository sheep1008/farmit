# 배포용 Nginx, HTTP만 (T02): Vue 빌드 결과를 내보내고 /api·/admin 은 backend(gunicorn)로 넘긴다
# 개발 때 Vite 프록시가 하던 일을 대신한다. 인증서를 받기 전과 로컬에서 배포 설정을 확인할 때 쓴다
# 인증서를 받은 뒤에는 docker-compose.https.yml이 이 파일 자리에 https.conf를 끼운다 (T03)

server {
    listen 80;
    server_name _;

    # Let's Encrypt가 "이 도메인의 주인이 맞는지" 확인하러 오는 주소. certbot이 같은 볼륨에 확인용 파일을 써 둔다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/app.conf;
}
