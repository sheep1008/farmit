# 화면·API를 내보내는 공통 설정. default.conf(HTTP)와 https.conf(HTTPS)의 server 블록이 include 한다
# 두 파일에 같은 내용을 따로 적으면 한쪽만 고쳐서 어긋나므로 한곳에 모았다

# Docker 내부 DNS. backend 컨테이너가 다시 만들어져 IP가 바뀌어도 10초 안에 새 주소를 찾는다
# (proxy_pass에 이름을 직접 쓰면 Nginx가 시작할 때 한 번만 찾아서, backend만 다시 띄우면 502가 난다)
resolver 127.0.0.11 valid=10s;

root /usr/share/nginx/html;

# 사진 진단이 사진을 data URL로 보낸다 (최대 약 1.5MB, backend/rag/llm.py MAX_IMAGE_CHARS). 기본값 1MB로는 413이 난다
client_max_body_size 4m;

location ~ ^/(api|admin)/ {
    set $backend http://backend:8000;
    proxy_pass $backend;            # 변수로 쓰면 요청 때마다 위 resolver로 이름을 찾는다. 경로는 그대로 넘어간다

    # 브라우저가 보낸 Host를 그대로 넘긴다 → Django ALLOWED_HOSTS·CSRF Origin 검사가 같은 출처로 통과한다
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 채팅 답변은 SSE로 조금씩 온다. 버퍼에 모으지 않고 바로 흘려보내고, 답이 길어도 끊지 않는다
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# Django 관리자 화면의 CSS·JS (backend가 collectstatic으로 모아 둔 볼륨)
location /static/ {
    alias /var/www/static/;
}

# 파일 이름에 내용 해시가 들어 있어(예: index-ftWFT9El.js) 바뀌면 이름도 바뀐다 → 오래 캐시해도 된다
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Vue Router(history 모드): /prices 같은 주소로 바로 들어와도 index.html을 주고 화면은 Vue가 고른다
location / {
    try_files $uri $uri/ /index.html;
}
