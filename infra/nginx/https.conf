# 배포용 Nginx, HTTPS (T03). docker-compose.https.yml이 default.conf 자리에 이 파일을 마운트한다
# 도메인을 적지 않는다: 인증서는 발급 때 붙인 이름(farmit) 폴더에 있고, 리다이렉트는 요청이 들어온 Host를 그대로 쓴다

# 80: 인증서 갱신 확인만 받고 나머지는 전부 HTTPS로 보낸다
server {
    listen 80;
    server_name _;

    # 갱신할 때도 Let's Encrypt는 80번으로 확인하러 온다. 이 주소까지 리다이렉트하면 갱신이 실패한다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;   # 301: 브라우저가 기억해 두고 다음부터 바로 HTTPS로 간다
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # certbot이 letsencrypt 볼륨에 받아 둔 인증서. live/ 아래는 최신 파일을 가리키는 링크라 갱신돼도 경로가 같다
    ssl_certificate     /etc/letsencrypt/live/farmit/fullchain.pem;   # 내 인증서 + 중간 인증서
    ssl_certificate_key /etc/letsencrypt/live/farmit/privkey.pem;     # 개인 키

    include /etc/nginx/app.conf;
}
