# HTTPS 덮어쓰기 파일 (T03). docker-compose.yml + docker-compose.prod.yml 위에 한 번 더 겹쳐서 쓴다.
# 인증서가 있어야 Nginx가 뜨므로, 처음에는 infra/scripts/issue-cert.sh로 인증서를 받은 뒤에 쓴다.
#
# 실행 (레포 루트에서):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml -f infra/docker-compose.https.yml --profile airflow --profile auction up -d --build
#
# prod.yml과 나눈 이유: 인증서가 없는 곳(내 PC, 인증서 받기 전의 서버)에서도 prod.yml만으로 배포 설정을 띄워 볼 수 있게

services:
  frontend:
    # Nginx는 시작할 때 읽은 인증서를 계속 쓴다. 하루에 한 번 설정을 다시 읽게 해서 갱신된 인증서를 적용한다
    # (reload는 접속을 끊지 않는다. "sleep & wait"는 컨테이너를 멈출 때 sleep이 끝나기를 기다리지 않게 하는 쓰기법)
    command: sh -c "while :; do sleep 1d & wait $$!; nginx -s reload; done & exec nginx -g 'daemon off;'"
    ports:
      - "443:443"                  # prod.yml의 80과 합쳐진다
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro   # 같은 자리에 마운트해 prod.yml의 default.conf를 바꾼다
      - letsencrypt:/etc/letsencrypt:ro

  # 인증서 자동 갱신. 12시간마다 확인하고, 만료 30일 전부터 실제로 갱신한다 (Let's Encrypt 인증서는 90일짜리)
  certbot:
    image: certbot/certbot:v5.1.0
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $$!; done"
    volumes:
      - letsencrypt:/etc/letsencrypt       # 인증서·계정 정보
      - certbot-www:/var/www/certbot       # 확인용 파일을 여기에 쓰면 Nginx가 80번으로 내보낸다
    mem_limit: 128m
    restart: unless-stopped

volumes:
  letsencrypt:
